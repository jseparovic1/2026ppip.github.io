services:
  website:
    build:
      context: .
      target: runtime
    volumes:
      - .:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-8123}:80"

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    depends_on:
      - website
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://website:80

services:
  website:
    build:
      context: .
      target: runtime
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./player-animations.js:/usr/share/nginx/html/player-animations.js:ro
      - ./player-data.js:/usr/share/nginx/html/player-data.js:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./assets:/usr/share/nginx/html/assets:ro
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-8123}:80"

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    depends_on:
      - website
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://website:80

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ /\. {
        return 404;
    }

    location ~* ^/(?:compose\.yaml|Dockerfile|nginx\.conf|vite\.config\.js|README\.md|package\.json)$ {
        return 404;
    }

    # Static media lives in public/ (Vite public dir) but is referenced as /assets/
    location ^~ /assets/ {
        alias /usr/share/nginx/html/public/assets/;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.png {
        root /usr/share/nginx/html/public;
    }

    location = /apple-touch-icon.png {
        root /usr/share/nginx/html/public;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|mp4|mov|svg|ico)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}

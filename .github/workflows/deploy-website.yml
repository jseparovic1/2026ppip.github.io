name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - website/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install media optimizers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg webp

      - name: Build optimized website
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

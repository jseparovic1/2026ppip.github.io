services:
  animations:
    image: python:3.13-slim
    working_dir: /work
    env_file:
      - ../.env
    volumes:
      - ..:/work
    command:
      - sh
      - -lc
      - >
        pip install --quiet replicate &&
        python imagegen/generate_player_animations.py
        --slug ${PLAYER_SLUG:-ivan-tomic}
        --mode ${MODE:-standard}
        --duration ${DURATION:-5}
        ${EXTRA_ARGS:-}
